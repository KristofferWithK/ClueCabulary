<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=overlays-content: when the software keyboard opens,
         let it sit ON TOP of the page instead of resizing or scrolling it. The
         app is built to fit the phone exactly, with no scroll anywhere, and the
         default (resizes-visual) turns that into a scrolling window the moment
         anyone types. The keyboard covers the board, which is the right thing
         to cover — the dock being typed into lifts above it, see --kb. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="ClueCabulary — learn Danish vocabulary through a cooperative word-association game with an AI companion." />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>ClueCabulary</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
