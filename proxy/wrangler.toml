name = "cluecabulary-proxy"
main = "worker.js"
compatibility_date = "2026-01-01"

# Only this origin may use the worker. It matters most when the worker holds
# the API key: without the lock, any website could spend your subscription
# through it. Change this if you serve the app from somewhere else, or delete
# the line to allow any origin.
# Two callers, and BOTH have to be here or one of the two apps cannot talk to
# the proxy at all:
#
#   https://kristofferwithk.github.io  the PWA on GitHub Pages. An Origin is
#                                      scheme + host + port and never a path,
#                                      so no /ClueCabulary on the end.
#   capacitor://localhost              the iOS app. The native shell serves the
#                                      same bundle from inside the app through
#                                      a WKWebView, so its requests do not come
#                                      from the Pages origin at all.
#
# Where that second one comes from, since guessing it wrong means the iOS app
# silently cannot reach Cluey: capacitor.config.ts sets neither `server.iosScheme`
# nor `server.hostname`, and Capacitor 8's own defaults are `capacitor` and
# `localhost` — @capacitor/cli declarations.d.ts documents `@default capacitor`,
# and InstanceDescriptorDefaults.hostname in @capacitor/ios is "localhost".
# A shell migrated from cordova-plugin-ionic-webview would send
# ionic://localhost instead; add it if that ever happens.
#
# Confirm it against the phone anyway, once: run the app, then
# `npx wrangler tail cluecabulary-proxy` and watch a real request. A refusal
# shows as the 403 from originAllowed.
[vars]
ALLOWED_ORIGIN = "https://kristofferwithk.github.io, capacitor://localhost"

# The daily caps. Both are optional — worker.js has defaults and explains the
# arithmetic behind them (1000 per install, 25000 across everyone, per UTC day).
# Set either here to override; 0 turns that cap off.
#
#   DAILY_CAP = "1000"
#   GLOBAL_DAILY_CAP = "25000"

# Where the counters live. This is the one part of the cap that cannot be
# committed with a working value: a KV namespace id is minted by your Cloudflare
# account, so it does not exist until you make one.
#
# The Actions workflow does it for you — it creates the namespace if it is
# missing and appends this block itself before deploying, so if you deploy that
# way there is nothing to do here.
#
# By hand, at a computer:
#
#   npx wrangler kv namespace create QUOTA
#
# then uncomment these two lines and paste the id it prints:
#
# [[kv_namespaces]]
# binding = "QUOTA"
# id = "paste-the-id-here"
#
# Without the binding the worker still works — it logs "no QUOTA KV binding"
# and serves every request unmetered. That is deliberate (a proxy that refuses
# everyone because an id was pasted wrong is worse than one that does not
# count), and it does mean a missing binding is a silent loss of the cap rather
# than an error. `npx wrangler tail cluecabulary-proxy` says which you have.

# What the app asks for instead of a model name. The app sends "cluey" and this
# decides what answers, so changing Cluey's brain is a proxy deploy rather than
# an app release every phone has to notice — and a model id retired upstream is
# fixed here instead of breaking every install.
#
# Extra aliases can front another service entirely, which is how a comparison
# stays blind (three names, three models, nothing on screen saying which):
#
#   MODEL_ALIASES = '''{"cluey":{"model":"gpt-oss:120b"},
#     "cluey-a":{"model":"mistral-large-3"},
#     "cluey-b":{"model":"gemini-3.6-flash","upstream":"https://generativelanguage.googleapis.com","path":"/v1beta/openai","key":"GEMINI_API_KEY"}}'''
#
# A name that is not listed here is forwarded as-is, so real model ids still work.
MODEL_ALIASES = '{"cluey":{"model":"gpt-oss:120b"}}'

# ---------------------------------------------------------------------------
# THE CASCADE (H7) — not switched on. This is the line that switches it on:
#
#   MODEL_ALIASES = '''{"cluey":      {"model":"<a small fast model>", "escalate":"cluey-hard"},
#     "cluey-hard": {"model":"gpt-oss:120b"}}'''
#
# Read the whole of this comment before you paste it. The saving is real and
# the arithmetic is below, but it turns on ONE number that nobody has measured,
# and the last section says how to measure it.
#
# WHAT IT DOES. "cluey" answers on the cheap model. When an answer comes back
# that the APP's own validator refuses — not JSON, or the schema rejects it, or
# checkClueLegality does, or the clue names a word that is not one of Casey's
# unrevealed greens — the app retries, and that retry asks for "cluey-hard".
# The worker also escalates by itself when the cheap model returns a 5xx or a
# 429, or cannot be reached at all.
#
# The retry is the part that makes this pay. It was already going to happen —
# src/ai/companion.ts has retried up to MAX_CORRECTIONS = 3 times since long
# before this existed — so escalating adds no call and no waiting. The round
# gets FASTER on average, because the first attempt is now the quick model.
#
# ---------------------------------------------------------------------------
# THE ARITHMETIC. Per logical AI call — one clue given, one set of guesses, one
# word translated — with
#
#     p  price of one call answered by the cheap model
#     P  price of one call answered by the flagship
#     r  share of cheap-model answers the app's validator refuses
#     s  the same share for the flagship
#
# and attempts capped at four (1 + MAX_CORRECTIONS):
#
#     today, one tier      P x (1 + s + s^2 + s^3)
#     with the cascade     p + r x P x (1 + s + s^2)
#
# Put s = 0.1 and the blueprint's own two prices — $0.0001 a call on the cheap
# tier, $0.002 on the flagship, a 20:1 ratio:
#
#     today                        $0.00222 a call
#     cascade, r = 0.05            $0.00021   90% less
#     cascade, r = 0.20            $0.00054   76% less
#     cascade, r = 0.35            $0.00088   60% less
#     cascade, r = 0.50            $0.00121   45% less
#     cascade, r = 0.956           $0.00222   break-even
#
# In the blueprint's own form — cheap share x cheap price + escalation share x
# flagship price — r = 0.2 makes 81.8% of REQUESTS cheap-tier ones, blending to
# $0.00045 a request against $0.002 today. Against the 25,000-request global
# ceiling below, that is the worst day this proxy can have costing $11 instead
# of $50.
#
# THE RESULT WORTH REMEMBERING, because it barely depends on s at all:
#
#     the cascade saves money unless  r  >  1 - p/P
#
# At 20:1 the cheap model would have to be refused on 96% of first attempts
# before this costs more than one tier. At 10:1, 91%. At 2:1 — barely a cascade
# — 55%. That is not luck; it is what escalating on a retry instead of adding a
# call buys you.
#
# WHAT IS MEASURED HERE AND WHAT IS NOT.
#   Measured: the biggest request a round sends is 8,208 bytes, about 2,050
#     input tokens (e2e/proxy-drive.mjs checks it, and fails if it moves far).
#     An ordinary round is 7 to 12 calls; worker.js works that out from the
#     board configs.
#   Not measured: r, the one number the whole thing turns on. It needs a real
#     cheap model answering real boards, and there was none in the session that
#     wrote this. s is assumed at 0.1 for the worked example and the break-even
#     hardly moves if it is wrong.
#   Not measured: output tokens, and the prices, which are yours to fill in.
#     Note that ollama.com is a flat subscription rather than per-token, so
#     there the currency is the rate limit; the cascade conserves it in exactly
#     the same proportion.
#
# HOW TO MEASURE r BEFORE TRUSTING ANY OF THIS. Set the cascade up, play five
# or six rounds, and run `npx wrangler tail cluecabulary-proxy`. Every
# escalation logs a line beginning "cascade:", and every request that arrives
# with ?tier=escalate is one the app refused. Escalations over total requests
# is r. If it is over about a third, try a bigger cheap model before deciding
# the cascade does not work.
#
# THE COSTS, so they are not a surprise:
#   - The daily cap counts requests, and a cheap model that is refused more
#     often makes more of them. At r = 0.2 a round spends about 10% more of
#     DAILY_CAP than it does today. The cap is 1000 and an enthusiastic day is
#     under 150, so this is noted rather than a problem.
#   - A worker-side escalation makes two upstream calls against one counted
#     request. The BILL is unchanged, because the call it replaced was a 5xx
#     and a 5xx is not a generation.
#   - The first time a phone escalates it pays one extra CORS preflight,
#     because the preflight cache is keyed by URL and the escalated one carries
#     ?tier=escalate. One round trip, cached for a day, on the slow path.
#   - A bad cheap model does not just cost more, it plays worse on the attempt
#     the player actually waits for. Play a round on it before shipping it.
#
# CHEAP_TIMEOUT_MS = "20000"
#
# Optional, off unless set, and the one setting here that can cost more than it
# saves: how long to wait for the cheap model before giving up and asking the
# flagship. It is for a tier that has HUNG. Set below what the cheap model
# genuinely takes on a 2,000-token prompt and every request becomes two — the
# abandoned one may still be billed — so watch `wrangler tail` first and then
# set it well above the slowest ordinary answer. The app abandons the whole
# request at 90 seconds anyway, so anything at or above that never fires.
# ---------------------------------------------------------------------------

# Which service this worker fronts. One worker serves either: Gemini's
# OpenAI-compatible layer wants the same Bearer token, so only the host moves
# and the app's Base URL supplies the path (/v1, or /v1beta/openai).
#
#   UPSTREAM = "https://generativelanguage.googleapis.com"
#
# Left unset it forwards to https://ollama.com.

# On a phone: run the "Deploy the AI proxy" workflow from this repository's
# Actions tab — see .github/workflows/deploy-proxy.yml for the three secrets it
# needs. Nothing below is required.
#
# At a computer, if you prefer:
#
#   npx wrangler login
#   npx wrangler deploy
#   npx wrangler secret put OLLAMA_API_KEY     # paste the key; stored
#                                              # encrypted, never in this repo
#
# The deploy prints a URL like https://cluecabulary-proxy.<you>.workers.dev —
# put that plus /v1 into the app's Settings -> Base URL, and leave the API key
# field empty.
