name: Deploy the AI proxy

# Run this by hand from the Actions tab. It exists so the proxy can be deployed
# from a phone: `wrangler` is a CLI and there is no mobile equivalent, but the
# three things it needs are secrets you can type into a web form.
#
# One-time setup, all in a mobile browser:
#   1. https://dash.cloudflare.com                      — free, no domain needed
#   2. https://dash.cloudflare.com/profile/api-tokens   — Create Token, using
#      the "Edit Cloudflare Workers" template. The Account ID is on the
#      Workers & Pages overview page.
#   3. Settings -> Secrets and variables -> Actions on this repository, add:
#        CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, OLLAMA_API_KEY
#
# Then run this workflow. The summary prints the Base URL to paste into the
# app. OLLAMA_API_KEY is uploaded as a Worker secret, so the key lives at
# Cloudflare and never in this repository, the app bundle, or your phone.
#
# Deliberately not `on: push` — it needs secrets, and it would fail loudly for
# anyone who cloned this repository without them.
on: workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are present
        # wrangler's own error for a missing token is not obvious on a phone.
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          missing=""
          [ -n "$TOKEN" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$KEY" ]     || missing="$missing OLLAMA_API_KEY"
          if [ -n "$missing" ]; then
            {
              echo "### Missing repository secrets"
              echo
              echo "Add these under **Settings → Secrets and variables → Actions**, then run this again:"
              for s in $missing; do echo "- \`$s\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "missing secrets:$missing" >&2
            exit 1
          fi

      - id: kv
        name: Make sure the quota namespace exists, and bind it
        # The daily cap counts requests in KV, and a KV namespace id is minted
        # by your account — it cannot be committed to this repository because it
        # does not exist until someone creates it. So create it here (once; on
        # every later run this finds the one already there) and append the
        # binding to wrangler.toml just before the deploy.
        #
        # Never fatal. The worker fails open with no binding, so the worst case
        # is an unmetered proxy, which is much better than a failed deploy —
        # and the summary below says which one you got. The usual reason this
        # step cannot do its job is an API token minted before the "Edit
        # Cloudflare Workers" template included Workers KV Storage:Edit.
        #
        # THE TITLE IS NOT THE BINDING, and the first run of this step proved it
        # the expensive way. `wrangler kv namespace create QUOTA` was expected
        # to title the namespace `<worker>-QUOTA`, the way older wrangler did;
        # wrangler 4 titles it plainly `QUOTA`. So the step created the
        # namespace, reported "✨ Success!" with its id, then failed to find a
        # namespace by the name it expected and exited — leaving a real
        # namespace in the account and an unmetered proxy in production, with
        # the summary correctly reporting no cap.
        #
        # Nothing local could have caught this: miniflare implements the KV API
        # but never mints a namespace, so the naming convention only exists on
        # the real account. Hence both names are accepted, newest first — the
        # one wrangler makes today, and the one an earlier run may have left.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TITLE: QUOTA
          LEGACY_TITLE: cluecabulary-proxy-QUOTA
        working-directory: proxy
        run: |
          set -o pipefail
          find_id() {
            npx --yes wrangler@4 kv namespace list 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                  const m=s.match(/\[[\s\S]*\]/); if(!m){process.exit(1)}
                  const all=JSON.parse(m[0])
                  const hit=all.find(n=>n.title===process.env.TITLE)
                    ?? all.find(n=>n.title===process.env.LEGACY_TITLE)
                  if(!hit){process.exit(1)}
                  process.stdout.write(hit.id)
                })'
          }
          id="$(find_id || true)"
          if [ -z "$id" ]; then
            npx --yes wrangler@4 kv namespace create QUOTA || true
            id="$(find_id || true)"
          fi
          if [ -z "$id" ]; then
            echo "could not create or find a KV namespace titled $TITLE or $LEGACY_TITLE" >&2
            exit 1
          fi
          printf '\n[[kv_namespaces]]\nbinding = "QUOTA"\nid = "%s"\n' "$id" >> wrangler.toml
          echo "bound=yes" >> "$GITHUB_OUTPUT"

      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: proxy
          # Newline-separated secret NAMES, each bound from env below. This is
          # what puts the Ollama key on the worker rather than on the phone.
          secrets: |
            OLLAMA_API_KEY
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

      - name: Say what to paste into the app
        # The step summary is the readable surface on a phone; a job log is not.
        run: |
          url="${{ steps.deploy.outputs.deployment-url }}"
          {
            echo "### Casey is deployed"
            echo
            if [ -n "$url" ]; then
              echo "In the app: **Settings → Base URL**, paste this, and leave the API key field **empty**:"
              echo
              echo '```'
              echo "${url%/}/v1"
              echo '```'
            else
              echo "Deployed, but Cloudflare did not report a URL. Find the worker at"
              echo "https://dash.cloudflare.com → Workers & Pages → cluecabulary-proxy,"
              echo "and use its address plus \`/v1\`."
            fi
            echo
            echo "Then tap **List models this server accepts** and pick one."
            echo
            if [ "${{ steps.kv.outputs.bound }}" = "yes" ]; then
              echo "The daily cap is on: 1000 requests per install, 25000 across everyone, per UTC day."
            else
              echo "⚠️ **No daily cap.** The quota namespace could not be created, so this"
              echo "worker is serving unmetered — anyone who finds its address can spend the"
              echo "key. Check the \`kv\` step's log; the usual cause is an API token without"
              echo "**Workers KV Storage: Edit**. Re-mint the token from the"
              echo "\"Edit Cloudflare Workers\" template and run this again."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
