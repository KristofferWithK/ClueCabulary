# Audition the neural voices for a language, because listening is the only
# review audio gets.
#
# Asks Google which voices exist for the locale — the list in make-audio.mjs
# is a guess frozen in code, this is the live answer — then bakes the probe
# words in every one of them and fingerprints the results. The finding this
# exists to settle is fb3ec2f: six different voice names produced
# byte-identical MP3s, which either means the names alias to one server-side
# model or the comparison measured stale files. The fingerprint table in the
# run summary answers that without downloading anything, and the clips are
# committed back to the branch that ran this, so a session can hand them over
# for the actual listen.
#
# Needs the TTS_API_KEY repository secret — a Google key restricted to the
# Cloud Text-to-Speech API.
name: Audition TTS voices

on:
  workflow_dispatch:
    inputs:
      lang:
        description: Dataset language to audition (da, de)
        default: da
      words:
        description: Probe words, comma-separated slugs or ids
        default: hus,koebe,roed
  # The dispatch API only sees workflows indexed from the default branch, so a
  # branch-only copy cannot be started by name. Pushes that touch this file
  # fire it instead — a session starts it by editing, committing and pushing.
  # Push events carry no inputs, hence the || defaults below.
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/audition-voices.yml']

permissions:
  contents: write

concurrency:
  group: audition-${{ github.ref }}

jobs:
  audition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No npm ci: make-audio.mjs runs on node builtins alone.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ask Google which voices exist
        env:
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          LANG_CODE: ${{ inputs.lang || 'da' }}
        run: |
          set -eu
          if [ -z "$TTS_API_KEY" ]; then
            echo "**No TTS_API_KEY secret** — nothing can be auditioned." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          case "$LANG_CODE" in
            da) locale=da-DK ;;
            de) locale=de-DE ;;
            *) echo "No locale for lang \"$LANG_CODE\""; exit 2 ;;
          esac
          curl -sS --fail-with-body -H "X-goog-api-key: $TTS_API_KEY" \
            "https://texttospeech.googleapis.com/v1/voices?languageCode=$locale" > voices.json
          count=$(jq '.voices | length' voices.json)
          {
            echo "### $count voices for $locale"
            echo
            echo "| voice | gender | Hz |"
            echo "|---|---|---|"
            jq -r '.voices[] | "| \(.name) | \(.ssmlGender) | \(.naturalSampleRateHertz) |"' voices.json
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.voices[] | "\(.name)\t\(.ssmlGender)\t\(.naturalSampleRateHertz)"' voices.json
          test "$count" -gt 0

      # What does Google do with a voice name that does not exist for the
      # locale? The whole point of the carded finding rests on the answer. A
      # silent fallback means a typo in TTS_VOICE bakes 900 words in the wrong
      # voice and says "900 made, 0 failed"; a 4xx means the mistake is loud
      # and the bake stops. Answered by asking, not by reading the docs.
      - name: What happens to a voice that does not exist
        env:
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
        run: |
          set -u
          # The six names the finding tried, plus the two that really exist as
          # reference. Hashing the audio rather than eyeballing it is the whole
          # point: identical hashes across names is what "byte-identical" meant.
          for v in da-DK-Neural2-D da-DK-Neural2-F da-DK-Wavenet-A da-DK-Wavenet-C \
                   da-DK-Wavenet-D da-DK-Wavenet-E da-DK-Wavenet-F da-DK-NotAVoice-Z; do
            code=$(curl -sS -o body.json -w '%{http_code}' \
              -H "X-goog-api-key: $TTS_API_KEY" -H 'Content-Type: application/json' \
              -X POST "https://texttospeech.googleapis.com/v1/text:synthesize" \
              -d "{\"input\":{\"text\":\"hus\"},\"voice\":{\"languageCode\":\"da-DK\",\"name\":\"$v\"},\"audioConfig\":{\"audioEncoding\":\"MP3\"}}")
            if [ "$code" = "200" ]; then
              hash=$(jq -r '.audioContent' body.json | base64 -d | sha256sum | cut -c1-12)
              echo "PROBE $v HTTP $code audio $hash"
            else
              echo "PROBE $v HTTP $code $(jq -rc '.error.message' body.json)"
            fi
          done

      # A single word cannot be auditioned. Danish sentence melody, the soft d,
      # and stød only appear in connected speech, and the question contour needs
      # a question. So every voice also reads a four-sentence passage taken
      # verbatim from the dataset's own examples — the sentences the app itself
      # would say — chosen for the sounds synthetic Danish gets wrong:
      #
      #   da:mor     Min mor laver god mad.            two soft d's
      #   da:mand    Der står en mand ved døren.       å, ø, ved, stød on mand
      #   da:mælk    Vil du have mælk i kaffen?        æ, and a question contour
      #   da:datter  Hendes datter er fem år gammel.   a number, å, stød on år
      #
      # One file per voice rather than one per sentence: prosody across a
      # sentence boundary is part of what is being judged, and one play button
      # per voice is what makes 35 of them listenable.
      - name: Read a passage in every voice
        env:
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          LANG_CODE: ${{ inputs.lang || 'da' }}
        run: |
          # --input-type=module: stdin is CommonJS by default, so import and
          # top-level await would both be syntax errors without it.
          node --input-type=module - <<'JS'
          import { readFileSync, writeFileSync, mkdirSync } from 'node:fs'

          const lang = process.env.LANG_CODE
          const key = process.env.TTS_API_KEY
          const IDS = ['da:mor', 'da:mand', 'da:mælk', 'da:datter']

          const words = JSON.parse(readFileSync(`src/data/words.${lang}.json`, 'utf8'))
          const byId = new Map(words.map((w) => [w.id, w]))
          const missing = IDS.filter((id) => !byId.get(id)?.exampleDa)
          if (missing.length) {
            // The passage is dataset content, so a trimmed or renamed word must
            // stop the run rather than quietly shorten what everyone listens to.
            console.error(`No exampleDa for: ${missing.join(', ')}`)
            process.exit(2)
          }
          const passage = IDS.map((id) => byId.get(id).exampleDa).join(' ')
          console.log(`passage (${passage.length} chars): ${passage}`)

          const voices = JSON.parse(readFileSync('voices.json', 'utf8')).voices
          const outDir = `audition/${lang}-sentences`
          mkdirSync(outDir, { recursive: true })

          let made = 0
          const failed = []
          for (const { name, languageCodes } of voices) {
            const res = await fetch('https://texttospeech.googleapis.com/v1/text:synthesize', {
              method: 'POST',
              headers: { 'X-goog-api-key': key, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                input: { text: passage },
                voice: { languageCode: languageCodes[0], name },
                audioConfig: { audioEncoding: 'MP3' },
              }),
            })
            if (!res.ok) {
              failed.push(`${name} (HTTP ${res.status})`)
              continue
            }
            const { audioContent } = await res.json()
            writeFileSync(`${outDir}/${name}.mp3`, Buffer.from(audioContent, 'base64'))
            made++
          }
          console.log(`${made} passages written, ${failed.length} failed`)
          if (failed.length) console.log(`failed: ${failed.join(', ')}`)
          JS

      - name: Bake the probe words in every voice
        env:
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          WORDS: ${{ inputs.words || 'hus,koebe,roed' }}
          LANG_CODE: ${{ inputs.lang || 'da' }}
        run: |
          set -u
          failed=""
          for v in $(jq -r '.voices[].name' voices.json); do
            echo "── $v"
            node scripts/make-audio.mjs --lang "$LANG_CODE" --only "$WORDS" \
              --voice "$v" --out "audition/$LANG_CODE/$v" --force || failed="$failed $v"
          done
          if [ -n "$failed" ]; then
            # Some voice tiers want a different API surface; a refusal is
            # itself an answer, so it is recorded rather than failing the run.
            echo "**Refused to bake:**$failed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fingerprint which names are the same audio
        env:
          LANG_CODE: ${{ inputs.lang || 'da' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import hashlib, json, os
          from pathlib import Path

          lang = os.environ["LANG_CODE"]
          root = Path("audition") / lang

          def fp(files):
              h = hashlib.sha256()
              for f in files:
                  h.update(f.read_bytes())
              return h.hexdigest()[:12]

          rows, slugs = [], set()
          for d in sorted(root.iterdir()) if root.exists() else []:
              mp3s = sorted(d.glob("*.mp3"))
              if not mp3s:
                  continue
              slugs.update(p.stem for p in mp3s)
              rows.append((d.name, fp(mp3s)))

          # The shipping clips join the comparison: if a fresh bake of the
          # shipping voice matches them, synthesis is deterministic — and then
          # any other name in the same row really is the same model.
          committed = Path("public/audio") / lang
          files = [committed / f"{s}.mp3" for s in sorted(slugs)]
          files = [f for f in files if f.exists()]
          if files:
              try:
                  voice = json.loads((committed / "manifest.json").read_text()).get("voice", "?")
              except Exception:
                  voice = "?"
              rows.append((f"shipping clips ({voice})", fp(files)))

          groups = {}
          for name, h in rows:
              groups.setdefault(h, []).append(name)

          print(f"### {len(groups)} distinct outputs from {len(rows)} sources")
          print()
          print("| fingerprint | identical sources |")
          print("|---|---|")
          for h, names in sorted(groups.items(), key=lambda kv: -len(kv[1])):
              print(f"| `{h}` | {', '.join(names)} |")
          print()
          PY

      - name: Commit the clips to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # voices.json travels with the clips: the gender and sample rate are
          # how a listener knows what they are hearing, and they exist nowhere
          # else in the repo.
          cp voices.json "audition/${{ inputs.lang || 'da' }}/voices.json"
          git add audition
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Bake the voice audition clips"
            git push
          fi
