# Bake every word of a language and commit the clips.
#
# The clips ship IN the repository (see the long note in deploy.yml), so this
# is how they get there: the TTS key is an Actions secret and never leaves it,
# which means the bake happens here or on the owner's own machine, not in a
# session.
#
# It fires on a push that touches this file — the same mechanism the audition
# workflow uses, and for the same reason: the dispatch API only sees workflows
# indexed off the default branch, so a branch-only copy has no start button.
# Bump BAKE_NONCE below to run it again.
#
# What it does NOT do is decide anything. The voice and the rate are
# make-audio.mjs's defaults — one rate per source, chosen by ear from the
# audition; passing them here would put the real values in two places and let
# them disagree.
name: Bake word audio

on:
  workflow_dispatch:
    inputs:
      lang:
        description: Dataset language to bake (da, de)
        default: da
      force:
        description: Re-bake every word even if the manifest says it is current
        type: boolean
        default: false
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/bake-audio.yml']

permissions:
  contents: write

concurrency:
  group: bake-audio-${{ github.ref }}

env:
  # Bump to re-run on a push. 5 = the words are re-baked at 1.0 and the 0.6 set
  # they used to be moves to audio/da/slow as the dictionary's 🐢.
  BAKE_NONCE: '5'

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No npm ci — make-audio.mjs runs on node builtins alone.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bake
        env:
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          LANG_CODE: ${{ inputs.lang || 'da' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          set -eu
          if [ -z "$TTS_API_KEY" ]; then
            echo "**No TTS_API_KEY secret** — nothing to bake with." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          before=$(find public/audio/"$LANG_CODE" -name '*.mp3' 2>/dev/null | wc -l)
          # All three sources every run, and the manifest decides what that
          # costs: a source whose text, voice and rate are unchanged reports
          # "Nothing to do" and makes no request at all. So this reconciles all
          # of the audio rather than making the caller remember which part
          # moved — the run that introduced words-slow re-baked `words` at 1.0
          # and spent nothing on the slow set, because those clips already
          # existed and were simply moved into their own directory.
          #
          # The voice guard inside the script refuses a name Google does not
          # serve, so a bad default fails here rather than producing 900 wrong
          # clips that sound fine one at a time.
          for src in words words-slow stories; do
            echo "── $src"
            node scripts/make-audio.mjs --lang "$LANG_CODE" --source "$src" $FORCE
          done
          after=$(find public/audio/"$LANG_CODE" -name '*.mp3' 2>/dev/null | wc -l)
          {
            echo "### Baked $LANG_CODE"
            echo
            echo '```'
            python3 -c "
          import json
          for label, path in (
              ('words     ', 'public/audio/$LANG_CODE/manifest.json'),
              ('words-slow', 'public/audio/$LANG_CODE/slow/manifest.json'),
              ('stories   ', 'public/audio/$LANG_CODE/story/manifest.json'),
          ):
              try:
                  m = json.load(open(path))
              except OSError:
                  print(label, 'MISSING')
                  continue
              print(label, m.get('provider'), m.get('voice'), 'rate', m.get('rate'),
                    len(m.get('entries', {})), 'clips')
          "
            echo '```'
            echo "$before clips before, $after after."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the clips
        env:
          LANG_CODE: ${{ inputs.lang || 'da' }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/audio/$LANG_CODE"
          if git diff --cached --quiet; then
            echo "Nothing changed — the clips on disk already match the manifest."
            exit 0
          fi
          # Chirp3 is not byte-reproducible, so this diff is large by nature
          # even when the audio is indistinguishable. That is the accepted
          # cost of committing the clips; see docs/DECISIONS.md.
          git commit -m "Bake the word audio ($LANG_CODE)"
          # Nine minutes is long enough for the branch to move underneath us —
          # one docs commit from a session is all it takes, and that is exactly
          # how the first run of this job lost its clips: baked fine, then the
          # push was rejected as non-fast-forward and the work died with the
          # runner. Rebase onto whatever arrived and try again. Nothing can
          # conflict: this job writes only public/audio, which nothing else
          # touches by hand.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — rebasing onto origin/$BRANCH and retrying"
            git pull --rebase origin "$BRANCH"
          done
          echo "::error::could not push the clips after 3 attempts"
          exit 1
