name: TestFlight build

# Run this by hand from the Actions tab. It exists so the native app can ship
# from a phone or a Windows machine: iOS builds need a Mac, and GitHub's macOS
# runners are that Mac (free for a public repository).
#
# One-time setup, all in a browser:
#   1. developer.apple.com → Certificates, IDs & Profiles → Identifiers → “+”
#      → App ID → com.kristofferwithk.cluecabulary (must match
#      capacitor.config.ts).
#   2. appstoreconnect.apple.com → My Apps → “+” → New App → iOS, name
#      ClueCabulary, that bundle ID, any SKU.
#   3. appstoreconnect.apple.com → Users and Access → Integrations
#      → App Store Connect API → Team Keys → Generate (role: App Manager).
#      Note the Key ID and Issuer ID, download the .p8 once.
#   4. developer.apple.com → Membership → note the Team ID.
#   5. Settings → Secrets and variables → Actions on this repository, add:
#        APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID,
#        ASC_KEY_P8 (the whole .p8 file's text, BEGIN/END lines included)
#
# Then run this workflow. Signing is automatic against the API key —
# -allowProvisioningUpdates registers the bundle ID and mints the profile on
# first use — and the export step uploads straight to TestFlight. The build
# number is the run number, so every run is a new build with no bookkeeping.
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are present
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          # The RAW secrets here: this step runs before anything has been
          # trimmed, and its only question is whether they exist at all.
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$TEAM" ]   || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$P8" ]     || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            {
              echo "### Missing repository secrets"
              echo
              echo "Add these under **Settings → Secrets and variables → Actions**, then run this again:"
              for s in $missing; do echo "- \`$s\`"; done
              echo
              echo "The header of \`.github/workflows/testflight.yml\` says where each value comes from."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "missing secrets:$missing" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the web app for the shell
        # Relative base, no service worker: assets ship in the bundle and
        # updates ride TestFlight builds.
        run: |
          npm ci
          CAP_BUILD=1 npm run build
          npx cap sync ios

      - name: Write the App Store Connect key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          mkdir -p ~/asc
          # Strip carriage returns and guarantee a trailing newline: a .p8
          # opened in a Windows editor on the way to the clipboard arrives with
          # CRLF, and a PEM with CRLF fails to parse — which Apple reports only
          # as a 401, with nothing to say the key was the problem.
          printf '%s\n' "$P8" | tr -d '\r' > ~/asc/key.p8
          chmod 600 ~/asc/key.p8

          # Trim: a value pasted into the secret box arrives with whatever
          # whitespace, newline or stray quote came with it, and a check that
          # rejects those is rejecting a correct credential.
          clean() { printf '%s' "$1" | tr -d '\r\n"'"'" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          KEY_ID=$(clean "$KEY_ID")
          ISSUER=$(clean "$ISSUER")
          # Later steps use the trimmed values, not the raw secrets.
          echo "KEY_ID_CLEAN=$KEY_ID" >> "$GITHUB_ENV"
          echo "ISSUER_CLEAN=$ISSUER" >> "$GITHUB_ENV"

          # The shape of what is stored, with every hex digit masked — enough
          # to see WHICH value is wrong without printing any of it.
          shape() { printf '%s' "$1" | sed 's/[0-9a-fA-F]/x/g'; }
          echo "ASC_KEY_ID:    ${#KEY_ID} chars, shape $(shape "$KEY_ID")"
          echo "ASC_ISSUER_ID: ${#ISSUER} chars, shape $(shape "$ISSUER")"

          # Prove the key is a key before spending ten minutes finding out it
          # is not. None of this prints the secret.
          fail=""
          head -1 ~/asc/key.p8 | grep -q 'BEGIN PRIVATE KEY' \
            || fail="$fail\n- ASC_KEY_P8 does not start with -----BEGIN PRIVATE KEY-----. Paste the WHOLE .p8 file, including the BEGIN and END lines."
          openssl pkey -in ~/asc/key.p8 -noout 2>/dev/null \
            || fail="$fail\n- ASC_KEY_P8 is not a private key OpenSSL can read. Re-copy the file; it can only be downloaded once, so generate a new key if it was lost."
          [ ${#KEY_ID} -eq 10 ] \
            || fail="$fail\n- ASC_KEY_ID is ${#KEY_ID} characters; a Key ID is 10 (it is the code in the .p8 filename, AuthKey_XXXXXXXXXX.p8)."
          # 8-4-4-4-12, the shape of a UUID, rather than a bare length.
          printf '%s' "$ISSUER" | grep -Eiq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' \
            || fail="$fail\n- ASC_ISSUER_ID is ${#ISSUER} characters, shape $(shape "$ISSUER") — not a UUID like xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx. It is at the TOP of Users and Access > Integrations > App Store Connect API, above the list of keys, NOT the Key ID next to your key."
          if [ -n "$fail" ]; then
            {
              echo "### The App Store Connect credentials are not usable"
              echo
              printf "$fail\n"
            } >> "$GITHUB_STEP_SUMMARY"
            printf "$fail\n" >&2
            exit 1
          fi
          echo "key parses, key id is 10 chars, issuer is a uuid"

      - name: Ask Apple whether the key works
        env:
          KEY_ID: ${{ env.KEY_ID_CLEAN }}
          ISSUER: ${{ env.ISSUER_CLEAN }}
        run: |
          set -o pipefail
          # xcodebuild reports a rejected key as "Communication with Apple
          # failed ... (401)" ten minutes into a build, which says nothing
          # about which of the three values is wrong. This asks the API the
          # same question in a second, with the same credentials.
          python3 - "$KEY_ID" "$ISSUER" <<'PY' > /tmp/asc.jwt
          import sys, json, time, base64, subprocess
          kid, iss = sys.argv[1], sys.argv[2]
          def b64(d): return base64.urlsafe_b64encode(d).rstrip(b'=')
          header = b64(json.dumps({"alg":"ES256","kid":kid,"typ":"JWT"}).encode())
          payload = b64(json.dumps({"iss":iss,"iat":int(time.time()),
                                    "exp":int(time.time())+600,
                                    "aud":"appstoreconnect-v1"}).encode())
          signing = header + b'.' + payload
          der = subprocess.run(["openssl","dgst","-sha256","-sign",
                                f"{__import__('os').path.expanduser('~')}/asc/key.p8"],
                               input=signing, capture_output=True, check=True).stdout

          def jose(d):
              """DER SEQUENCE{INTEGER r, INTEGER s} -> the raw 64 bytes ES256 wants.

              The header is the tag and the length: two bytes in short form,
              and two plus the count bytes in long form. Adding one for the tag
              on top of that — which an earlier version did — lands inside the
              first INTEGER and walks off the end of the buffer.
              """
              if d[0] != 0x30:
                  raise ValueError('signature is not a DER sequence')
              i = 2 if d[1] < 0x80 else 2 + (d[1] & 0x7f)
              out = b''
              for _ in range(2):
                  if d[i] != 0x02:
                      raise ValueError('expected a DER integer')
                  ln = d[i + 1]
                  out += d[i + 2:i + 2 + ln].lstrip(b'\x00').rjust(32, b'\x00')
                  i += 2 + ln
              return out

          sys.stdout.write((signing + b'.' + b64(jose(der))).decode())
          PY
          # No square brackets in the URL: curl reads [ ] as its own globbing
          # syntax and refuses the whole thing as malformed (exit 3) before it
          # ever reaches Apple. bundleId is in the default response anyway.
          code=$(curl -s -o /tmp/asc.json -w '%{http_code}' \
            -H "Authorization: Bearer $(cat /tmp/asc.jwt)" \
            'https://api.appstoreconnect.apple.com/v1/apps?limit=200')
          if [ "$code" != "200" ]; then
            {
              echo "### Apple refused these credentials (HTTP $code)"
              echo
              echo "The key, the Key ID and the Issuer ID are a matching set — one of the three is from somewhere else. Most common causes:"
              echo "- The **Issuer ID** was copied from beside the key instead of from the top of the **Integrations → App Store Connect API** page."
              echo "- The key was generated under **Users and Access → Integrations**, but with a role below **App Manager**."
              echo "- The \`.p8\` belongs to a different, older key than the Key ID given."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "App Store Connect returned $code" >&2
            exit 1
          fi
          # Does the app record exist, with the bundle id the shell is built for?
          if ! grep -q 'com.kristofferwithk.cluecabulary' /tmp/asc.json; then
            {
              echo "### The credentials work, but there is no app with this bundle ID"
              echo
              echo "Apple accepted the key and listed your apps, and none of them is \`com.kristofferwithk.cluecabulary\`."
              echo "Create it at **App Store Connect → My Apps → + → New App**, with exactly that bundle ID, then run this again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "no app record for com.kristofferwithk.cluecabulary" >&2
            exit 1
          fi
          echo "Apple accepted the key, and the app record exists."

      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ env.KEY_ID_CLEAN }}
          ISSUER: ${{ env.ISSUER_CLEAN }}
        run: |
          # pipefail, because piping xcodebuild into tail takes tail's exit
          # code — the first run "passed" a failed archive and then failed
          # confusingly at export, looking for a file the archive never wrote.
          set -o pipefail
          mkdir -p "$PWD/ios/App/output"
          xcodebuild -workspace ios/App/App.xcodeproj/project.xcworkspace \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/ios/App/output/App.xcarchive" \
            archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/asc/key.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" \
            MARKETING_VERSION=0.1.0 \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tail -40

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ env.KEY_ID_CLEAN }}
          ISSUER: ${{ env.ISSUER_CLEAN }}
        run: |
          set -o pipefail
          mkdir -p "$PWD/ios/App/output"
          cat > "$PWD/ios/App/output/export.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$PWD/ios/App/output/App.xcarchive" \
            -exportOptionsPlist "$PWD/ios/App/output/export.plist" \
            -exportPath "$PWD/ios/App/output" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/asc/key.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            | tail -20

      - name: Say what happens next
        run: |
          {
            echo "### Build ${{ github.run_number }} is on its way to TestFlight"
            echo
            echo "Apple processes it for a few minutes, then it appears at"
            echo "**appstoreconnect.apple.com → ClueCabulary → TestFlight**."
            echo
            echo "First time only: add yourself under **Internal Testing** —"
            echo "make a group, tick your own Apple ID, and the TestFlight app"
            echo "on the phone offers the install. Every later build lands in"
            echo "the same place with no review."
          } >> "$GITHUB_STEP_SUMMARY"
