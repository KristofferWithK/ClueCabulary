name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # The word audio ships IN this repository, and the bake below only fills
      # gaps.
      #
      # It was gitignored at first, on the reasoning that 900 clips is a build
      # artefact a script remakes in five minutes and a voice change should not
      # be an unreviewable binary diff. Two things beat that. Nobody reviews
      # audio by reading a diff — you listen to it — and a voice changes once,
      # while it is being chosen, and then never. Against that, keeping it out
      # cost a secret, a cache key and a bake step, each of which is a thing
      # that can fail quietly; the same shape of failure had just cost an
      # afternoon in deploy-proxy.yml.
      #
      # So the clips are committed and every checkout has them — this job, a
      # cloud sandbox, a fresh clone. This step exists for the one case that
      # leaves: words added to the dataset without a bake. It is skipped
      # entirely when nothing is missing, and skipped with an explanation when
      # there is no key. Revisit if the total ever gets large — nine languages
      # of words is fine, nine languages of SENTENCES would not be.
      - name: Bake anything the dataset gained since the last bake
        env:
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          VOICE: ${{ vars.TTS_VOICE }}
        # The key is read in the shell rather than in `if:` — the secrets
        # context is not dependable in a step condition, and a step that
        # silently never runs is worse than one that says why it didn't.
        run: |
          have=$(ls public/audio/*/*.mp3 2>/dev/null | wc -l)
          echo "$have clips in the checkout."
          if [ -z "$TTS_API_KEY" ]; then
            echo "No TTS_API_KEY secret, so nothing can be baked here — shipping what is committed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -n "$VOICE" ]; then
            node scripts/make-audio.mjs --voice "$VOICE"
          else
            node scripts/make-audio.mjs
          fi
          now=$(ls public/audio/*/*.mp3 2>/dev/null | wc -l)
          echo "$now clips in this build ($((now - have)) baked here)." >> "$GITHUB_STEP_SUMMARY"

      - run: npm run build
      # No configure-pages step: a workflow token cannot create the Pages site
      # ("Resource not accessible by integration"). Enable it once by hand at
      # Settings -> Pages -> Source: GitHub Actions; deploy-pages then works.
      # The base path is pinned in vite.config.ts, so nothing here needs it.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
