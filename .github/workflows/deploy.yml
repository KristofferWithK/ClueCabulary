name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # The word audio, which is NOT in this repository.
      #
      # public/audio/ is gitignored — 900 clips is ~7.5MB of build artefact that
      # `scripts/make-audio.mjs` remakes in five minutes, and committing it
      # would make a voice change an unreviewable binary diff. That reasoning
      # holds, and it left a hole nobody noticed: the iOS build gets the clips
      # because `npx cap sync` copies them off the machine that baked them, but
      # THIS job builds from a clean checkout, so the deployed web app had no
      # audio at all and fell back to whatever da-DK voice the phone carries.
      #
      # So the runner bakes its own, and caches them against the dataset and the
      # voice — the two things that decide what the clips should sound like. An
      # ordinary deploy restores the cache and calls nothing.
      #
      # No secret, no bake, no failure: the app is built to fall back, which is
      # exactly how it shipped before the audio existed.
      - id: audio
        uses: actions/cache@v4
        with:
          path: public/audio
          key: audio-${{ hashFiles('src/data/words.*.json') }}-${{ vars.TTS_VOICE || 'default' }}
      - name: Bake the word audio
        # The key is checked in the shell rather than in `if:` — the secrets
        # context is not dependable in a step condition, and a workflow that
        # silently never runs is worse than one that says why it didn't.
        if: steps.audio.outputs.cache-hit != 'true'
        env:
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          VOICE: ${{ vars.TTS_VOICE }}
        run: |
          if [ -z "$TTS_API_KEY" ]; then
            echo "no TTS_API_KEY secret — skipping the bake, the app will fall back"
            exit 0
          fi
          if [ -n "$VOICE" ]; then
            node scripts/make-audio.mjs --voice "$VOICE"
          else
            node scripts/make-audio.mjs
          fi
      - name: Say whether this build can speak
        run: |
          n=$(ls public/audio/*/*.mp3 2>/dev/null | wc -l)
          if [ "$n" -gt 0 ]; then
            echo "$n clips in this build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No baked audio in this build — the app will use each phone's own voice." >> "$GITHUB_STEP_SUMMARY"
            echo "Add a \`TTS_API_KEY\` repository secret to bake it here." >> "$GITHUB_STEP_SUMMARY"
          fi

      - run: npm run build
      # No configure-pages step: a workflow token cannot create the Pages site
      # ("Resource not accessible by integration"). Enable it once by hand at
      # Settings -> Pages -> Source: GitHub Actions; deploy-pages then works.
      # The base path is pinned in vite.config.ts, so nothing here needs it.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
