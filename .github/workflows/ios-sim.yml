name: iOS simulator check

# What the app looks like with a keyboard up, screenshotted on an actual iOS
# simulator, before anyone's phone sees it.
#
# This exists because the keyboard has now cost several TestFlight builds, each
# one a guess about what iOS means by "keyboard height" verified only by
# someone holding a phone. A simulator has the same keyboard, the same safe
# areas and the same WKWebView, and it runs here for free.
#
# The screenshot lands in the run's artifacts, and the numbers the app used to
# place the composer are printed in the log.
on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Simulator device name'
        default: 'iPhone 16 Pro'
        type: string
      keyboard:
        description: 'Pretend the keyboard is this many points tall (0 for none)'
        default: '336'
        type: string

jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$newest" ] && sudo xcode-select -s "$newest"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the web app into the shell
        run: |
          npm ci
          CAP_BUILD=1 npm run build
          npx cap sync ios

      - name: Seed a round, and a keyboard
        # A simulator will install and photograph an app but not tap one, and
        # every attempt to automate a touch here cost more than it returned.
        # It does not have to: the app keeps its state in localStorage, so the
        # round in ios/sim-seed.json was played in a browser and is handed over
        # as a starting position — and cluecab-kbsim makes the app do
        # everything it does for a real keyboard, without one.
        env:
          KB: ${{ inputs.keyboard }}
        run: |
          python3 - "$KB" <<'PY'
          import json, sys, pathlib
          seed = json.load(open('ios/sim-seed.json'))
          seed['cluecab-howto-v3'] = 'seen'
          seed['cluecab-kbsim'] = sys.argv[1]
          script = '<script>try{' + ''.join(
              f'localStorage.setItem({json.dumps(k)},{json.dumps(v)});' for k, v in seed.items()
          ) + '}catch(e){}</script>'
          p = pathlib.Path('ios/App/App/public/index.html')
          p.write_text(p.read_text() + script, encoding='utf-8')
          print(f'seeded {len(seed)} keys, keyboard {sys.argv[1]}px')
          PY

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcodeproj/project.xcworkspace \
            -scheme App -configuration Debug -sdk iphonesimulator \
            -derivedDataPath "$PWD/dd" \
            CODE_SIGNING_ALLOWED=NO build | tail -15

      - name: Boot the simulator with a software keyboard
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          set -o pipefail
          xcrun simctl list devices available | grep -i iphone || true
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v if x['name']=='$DEVICE'))")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          # Without this the simulator uses the Mac's keyboard and never draws
          # one on screen — which is the entire subject of this check.
          xcrun simctl spawn "$udid" defaults write com.apple.keyboard.ContinuousPath \
            KeyboardContinuousPathEnabled -bool false || true
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true
          xcrun simctl bootstatus "$udid" -b

      - name: Install and launch
        run: |
          app=$(find "$PWD/dd/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)
          echo "app: $app"
          xcrun simctl install "$UDID" "$app"
          xcrun simctl launch "$UDID" com.kristofferwithk.cluecabulary
          sleep 8

      - name: Let it settle
        # The seeded round and the simulated keyboard both apply on their own.
        run: sleep 10

      - name: Screenshot
        if: always()
        run: xcrun simctl io "$UDID" screenshot keyboard.png || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshot
          path: keyboard.png
          if-no-files-found: warn
