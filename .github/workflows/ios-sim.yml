name: iOS simulator check

# What the app looks like with a keyboard up, screenshotted on an actual iOS
# simulator, before anyone's phone sees it.
#
# This exists because the keyboard has now cost several TestFlight builds, each
# one a guess about what iOS means by "keyboard height" verified only by
# someone holding a phone. A simulator has the same keyboard, the same safe
# areas and the same WKWebView, and it runs here for free.
#
# The screenshot lands in the run's artifacts, and the numbers the app used to
# place the composer are printed in the log.
on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Simulator device name'
        default: 'iPhone 16 Pro'
        type: string

jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$newest" ] && sudo xcode-select -s "$newest"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the web app into the shell
        run: |
          npm ci
          CAP_BUILD=1 npm run build
          npx cap sync ios

      - name: Turn the keyboard readout on before the app starts
        # The app shows its placement arithmetic when this key is set, and
        # localStorage inside the WKWebView cannot be reached from the outside
        # — so it is seeded from the page itself at build time.
        run: |
          cat >> ios/App/App/public/index.html <<'HTML'
          <script>try { localStorage.setItem('cluecab-kbdebug', '1') } catch (e) {}</script>
          HTML

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcodeproj/project.xcworkspace \
            -scheme App -configuration Debug -sdk iphonesimulator \
            -derivedDataPath "$PWD/dd" \
            CODE_SIGNING_ALLOWED=NO build | tail -15

      - name: Boot the simulator with a software keyboard
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          set -o pipefail
          xcrun simctl list devices available | grep -i iphone || true
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v if x['name']=='$DEVICE'))")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          # Without this the simulator uses the Mac's keyboard and never draws
          # one on screen — which is the entire subject of this check.
          xcrun simctl spawn "$udid" defaults write com.apple.keyboard.ContinuousPath \
            KeyboardContinuousPathEnabled -bool false || true
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true
          xcrun simctl bootstatus "$udid" -b

      - name: Install and launch
        run: |
          app=$(find "$PWD/dd/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)
          echo "app: $app"
          xcrun simctl install "$UDID" "$app"
          xcrun simctl launch "$UDID" com.kristofferwithk.cluecabulary
          sleep 8

      - name: Tap into the clue field
        run: |
          set -o pipefail
          brew tap facebook/fb >/dev/null 2>&1 || true
          brew install idb-companion >/dev/null 2>&1 || true
          pip3 install --break-system-packages fb-idb >/dev/null 2>&1 || pip3 install fb-idb >/dev/null 2>&1 || true
          idb connect "$UDID" || true
          # Start a round: the play button, then the clue field. Found by
          # accessibility label rather than by guessed coordinates, so a layout
          # change moves the tap with it.
          tap_label() {
            idb ui describe-all --udid "$UDID" 2>/dev/null \
              | python3 -c "
import sys, json
want = sys.argv[1]
for line in sys.stdin:
    try: el = json.loads(line)
    except Exception: continue
    label = (el.get('AXLabel') or '') + ' ' + (el.get('AXValue') or '')
    if want.lower() in label.lower():
        f = el['frame']
        print(int(f['x'] + f['width'] / 2), int(f['y'] + f['height'] / 2))
        break
" "$1"
          }
          play=$(tap_label 'Spil videre')
          [ -n "$play" ] && idb ui tap --udid "$UDID" $play && sleep 4
          field=$(tap_label 'one-word clue')
          echo "clue field at: ${field:-not found}"
          [ -n "$field" ] && idb ui tap --udid "$UDID" $field
          sleep 4

      - name: Screenshot
        if: always()
        run: xcrun simctl io "$UDID" screenshot keyboard.png || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshot
          path: keyboard.png
          if-no-files-found: warn
