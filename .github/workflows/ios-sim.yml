name: iOS simulator check

# What the app looks like with a keyboard up, screenshotted on an actual iOS
# simulator, before anyone's phone sees it.
#
# This exists because the keyboard has now cost several TestFlight builds, each
# one a guess about what iOS means by "keyboard height" verified only by
# someone holding a phone. A simulator has the same keyboard, the same safe
# areas and the same WKWebView, and it runs here for free.
#
# The screenshot lands in the run's artifacts, and the numbers the app used to
# place the composer are printed on the screen.
#
# It now also films the launch, because the open question stopped being WHERE
# the composer ends up and became WHEN it gets there. A still cannot tell a
# composer that rode up with the keyboard from one that appeared after it —
# and the ride ships ON now, so the default run films the shipped behaviour
# and `still` films the old wait-for-the-document one (localStorage
# cluecab-kbstill). Read the two limitations under "Raise a real keyboard"
# before trusting a film of the seeded path to answer the timing question.
on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Simulator device name'
        default: 'iPhone 16 Pro'
        type: string
      keyboard:
        description: 'Pretend the keyboard is this many points tall (0 for none)'
        default: '336'
        type: string
      still:
        description: 'Opt OUT of the ride — the dock waits for the document (cluecab-kbstill)'
        default: false
        type: boolean
      debug:
        description: 'Show the keyboard numbers on screen (cluecab-kbdebug)'
        default: true
        type: boolean
      tap:
        description: 'Try to raise a REAL keyboard with idb. Forces keyboard=0. Unproven — see the step.'
        default: false
        type: boolean

jobs:
  simulator:
    runs-on: macos-15
    # contents: write is for the film branch below, nothing else — this job
    # never touches an existing ref.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$newest" ] && sudo xcode-select -s "$newest"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the web app into the shell
        run: |
          npm ci
          CAP_BUILD=1 npm run build
          npx cap sync ios

      - name: Seed a round, a keyboard, and the flags
        # A simulator will install and photograph an app but not tap one, and
        # every attempt to automate a touch here cost more than it returned.
        # It does not have to: the app keeps its state in localStorage, so the
        # round in ios/sim-seed.json was played in a browser and is handed over
        # as a starting position — and cluecab-kbsim makes the app do
        # everything it does for a real keyboard, without one.
        #
        # This edits the COPY under ios/, after cap sync, in this checkout
        # only. Nothing here is committed and none of it reaches a device.
        env:
          KB: ${{ inputs.keyboard }}
          STILL: ${{ inputs.still }}
          DEBUG: ${{ inputs.debug }}
          TAP: ${{ inputs.tap }}
        run: |
          python3 - "$KB" "$STILL" "$DEBUG" "$TAP" <<'PY'
          import json, re, sys, pathlib

          kb = sys.argv[1]
          still = sys.argv[2] == 'true'
          debug = sys.argv[3] == 'true'
          tap = sys.argv[4] == 'true'

          # A real keyboard and a pretended one are mutually exclusive. The
          # pretend one applies the finished state on a timer, so it would
          # already be up before any tap landed, and the film would show the
          # two fighting rather than either one.
          if tap and kb != '0':
              print(f'tap requested: forcing keyboard {kb} -> 0')
              kb = '0'

          seed = json.load(open('ios/sim-seed.json'))

          # The seeded round has to be one the CURRENT stores will still
          # rehydrate. gameStore reached version 6 while the seed said 3, and
          # migrateGame drops a round saved before v4 on purpose -- so the app
          # opened on Home with nothing to lift, and the check photographed it
          # happily for four runs. Regenerate with:
          #     npm run build && node scripts/make-sim-seed.mjs
          for path, key in (('src/stores/gameStore.ts', 'cluecab-game-v1'),
                            ('src/stores/settingsStore.ts', 'cluecab-settings-v1')):
              store = pathlib.Path(path).read_text(encoding='utf-8')
              want = re.search(r"name: '" + key + r"',\s*\n\s*version: (\d+)", store)
              if not want:
                  raise SystemExit(f'no version for {key} in {path}')
              have = json.loads(seed[key]).get('version')
              if have != int(want.group(1)):
                  raise SystemExit(
                      f'{key}: seed is version {have}, store is {want.group(1)} -- '
                      'rerun scripts/make-sim-seed.mjs'
                  )
              print(f'{key} version {have} matches the store')

          # The rules overlay's key, read from the store rather than written
          # here. It used to be the literal 'cluecab-howto-v3'; the store
          # bumped to v4 and this line did not, so the overlay opened over
          # every screenshot this workflow has taken since -- run 10 is a
          # photograph of How to Play, not of a keyboard. A missing key is a
          # hard failure now: seeding nothing is what made that silent.
          src = pathlib.Path('src/stores/uiStore.ts').read_text(encoding='utf-8')
          m = re.search(r"HOWTO_KEY = '([^']+)'", src)
          if not m:
              raise SystemExit('no HOWTO_KEY in src/stores/uiStore.ts: the rules would cover the screen')
          seed[m.group(1)] = 'seen'
          print(f'rules suppressed via {m.group(1)}')
          seed['cluecab-kbsim'] = kb
          if still:
              seed['cluecab-kbstill'] = '1'
          if debug:
              seed['cluecab-kbdebug'] = '1'
          js = ''.join(
              f'localStorage.setItem({json.dumps(k)},{json.dumps(v)});' for k, v in seed.items()
          )

          if tap:
              # Two jobs the pretend keyboard was doing that now need doing
              # without it.
              #
              # One: reach the round. Which screen is showing is not persisted,
              # so a seeded save opens on Home behind a "Continue game" button.
              # A programmatic click is enough for that: no keyboard is
              # involved, so no user gesture is required.
              #
              # (Everything from here to the PY terminator stays plain ASCII.
              # python3 reading a script from stdin decodes it with the
              # locale's encoding, and a runner with no LANG set decodes as
              # ASCII, where one em dash in a comment is a SyntaxError.)
              #
              # Two: put the caret in the field. That DOES need a gesture, but
              # it does not need the gesture to be aimed. Any touch anywhere is
              # turned into a focus here, which is what lets the tap below be a
              # fixed point rather than a search. Capture phase and
              # stopPropagation so the touch never reaches the board and plays
              # a card; no preventDefault, which would suppress the focus that
              # is the entire point.
              js += (
                  "setTimeout(function(){var b=document.querySelector('.home-play');"
                  "if(b)b.click();},1500);"
                  "addEventListener('pointerdown',function f(e){"
                  "var i=document.querySelector('.dock input,.dock textarea');"
                  "if(!i)return;e.stopPropagation();"
                  "removeEventListener('pointerdown',f,true);i.focus();},true);"
              )

          p = pathlib.Path('ios/App/App/public/index.html')
          p.write_text(p.read_text() + '<script>try{' + js + '}catch(e){}</script>', encoding='utf-8')
          print(f'seeded {len(seed)} keys, keyboard {kb}, still {still}, debug {debug}, tap {tap}')
          PY

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcodeproj/project.xcworkspace \
            -scheme App -configuration Debug -sdk iphonesimulator \
            -derivedDataPath "$PWD/dd" \
            CODE_SIGNING_ALLOWED=NO build | tail -15

      - name: Boot the simulator with a software keyboard
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          set -o pipefail
          xcrun simctl list devices available | grep -i iphone || true
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v if x['name']=='$DEVICE'))")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          # Without this the simulator uses the Mac's keyboard and never draws
          # one on screen — which is the entire subject of this check.
          xcrun simctl spawn "$udid" defaults write com.apple.keyboard.ContinuousPath \
            KeyboardContinuousPathEnabled -bool false || true
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true
          xcrun simctl bootstatus "$udid" -b

      - name: A Python that fb-idb still runs on
        # fb-idb calls asyncio.get_event_loop() at startup. That stopped
        # creating a loop on demand and now raises, so under Homebrew's
        # python@3.14 every idb command dies in the same traceback before it
        # reaches the simulator:
        #     RuntimeError: There is no current event loop in thread
        #     'MainThread'
        # That is what sank run 11 -- the step failed in one second, pipefail
        # aborted it, continue-on-error made it look like a tap that simply
        # did nothing. 3.11 is the newest where get_event_loop still obliges.
        if: inputs.tap
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch idb
        # Before the recording starts, not during it: brew takes minutes and
        # there is no reason to film them.
        if: inputs.tap
        continue-on-error: true
        env:
          NONINTERACTIVE: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ENV_HINTS: '1'
        run: |
          # NONINTERACTIVE is the fix for what sank this last time: Homebrew
          # asks before adding a third-party tap, the prompt had nowhere to go
          # on a runner, so idb-companion never installed — and idb answers
          # questions about a simulator it cannot reach with silence rather
          # than with an error, which read as an empty screen.
          brew tap facebook/fb
          brew install --formula facebook/fb/idb-companion
          # Into the pinned 3.11 from the step above, which is ahead of
          # Homebrew's python on PATH. Printed, because "which idb" is the
          # one line that tells the next reader whether the pin took.
          pip3 install fb-idb
          python3 -V
          which idb
          # The companion is a daemon; idb talks to it rather than to the
          # simulator. nohup so it outlives this step.
          nohup idb_companion --udid "$UDID" > idb-companion.log 2>&1 &
          sleep 5
          idb connect "$UDID"
          idb list-targets

      - name: Install, start filming, and launch
        run: |
          app=$(find "$PWD/dd/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)
          echo "app: $app"
          xcrun simctl install "$UDID" "$app"
          # Filming starts BEFORE the launch, because the second worth seeing is
          # the first one. h264 rather than the default hevc so the file plays
          # in a browser without being converted first.
          xcrun simctl io "$UDID" recordVideo --codec h264 --force keyboard.mp4 &
          echo $! > rec.pid
          sleep 2
          xcrun simctl launch "$UDID" com.kristofferwithk.cluecabulary
          sleep 8

      - name: Raise a real keyboard
        # The one thing the seeded path structurally cannot show. cluecab-kbsim
        # stands the finished keyboard-up state up on a timer; there is no
        # keyboard animating beside it, so a film of it shows where things end
        # and says nothing about when they got there — which is the only
        # question the ride answers. For that a real keyboard has to come up,
        # and a real keyboard needs a touch.
        #
        # This is a second attempt, and it is narrower than the first. That one
        # (August 2026, reverted the same evening) looked the field up in the
        # accessibility tree and tapped its centre, which asks two unanswered
        # questions at once: whether idb can drive a runner at all, and whether
        # idb sees inside a WKWebView. It never got past the first. Here the
        # page volunteers — the shim injected during seeding turns any touch
        # into a focus — so the tap is a fixed point in the middle of the
        # screen and only the first question is left.
        #
        # continue-on-error rather than the `|| true` on every line it used to
        # carry: that armour meant a broken tap produced a green run and a
        # screenshot that looked plausible. This one goes red and still uploads
        # its film.
        if: inputs.tap
        continue-on-error: true
        run: |
          set -o pipefail
          idb ui tap --udid "$UDID" 200 400
          sleep 4
          # A second tap, high on the screen, away from any dock. The shim
          # consumed itself on the first touch, so this one reaches the page —
          # where the scrim turns any board tap into a dismissal. That puts
          # the HIDE on film too: the dock has no hide ride (the departing
          # keyboard occludes the body restore), and this film is the evidence
          # for whether that stays true.
          idb ui tap --udid "$UDID" 200 100
          sleep 3

      - name: Let it settle
        run: sleep 8

      - name: Screenshot
        if: always()
        run: xcrun simctl io "$UDID" screenshot keyboard.png || true

      - name: Stop filming
        if: always()
        run: |
          # SIGINT, not SIGKILL. recordVideo writes the file's index when it is
          # interrupted; a killed recording leaves bytes that will not play.
          # Twice over because the pid is xcrun's, and whether the signal
          # reaches the simctl underneath depends on whether xcrun exec'd it.
          [ -f rec.pid ] && kill -INT "$(cat rec.pid)" 2>/dev/null || true
          pkill -INT -f 'simctl io' 2>/dev/null || true
          sleep 4
          ls -l keyboard.mp4 || echo 'no video was written'

      - name: Push the film where a keyless session can fetch it
        # The artifact below needs a browser login or a PAT to download, and
        # the agent sessions that fire this workflow hold neither — they reach
        # GitHub only as git. So the film also goes out as an orphan branch,
        # sim-film/<run_number>, in a mini-repo of its own (no index games
        # with the build tree). The reader deletes the branch after fetching;
        # nothing triggers on sim-film/* pushes (deploy.yml is main-only).
        if: always()
        run: |
          mkdir sim-film
          cp keyboard.mp4 sim-film/ 2>/dev/null || true
          cp keyboard.png sim-film/ 2>/dev/null || true
          ls sim-film
          cd sim-film
          git init -q -b film
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -qm "sim film, run ${{ github.run_number }}"
          git push -q -f \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "HEAD:refs/heads/sim-film/${{ github.run_number }}"
          echo "pushed sim-film/${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-${{ inputs.still && 'still' || 'ride' }}${{ inputs.tap && '-realkb' || '' }}
          path: |
            keyboard.png
            keyboard.mp4
            idb-companion.log
          if-no-files-found: warn
